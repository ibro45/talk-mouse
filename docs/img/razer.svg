4 44 214Z" fill="#303a48" stroke="#566275" stroke-width="1.8"/><path d="M44 272L60 270Q64 270 64 274V318Q64 322 60 322L50 323Q46 323 46 319L42 276Q42 272 44 272Z" fill="#303a48" stroke="#566275" stroke-width="1.8"/><path d="M40 128Q14 136 14 164V206Q14 214 22 212L38 207Q42 205 42 201V132Q42 128 40 128Z" fill="#ffb454" stroke="#566275" stroke-width="1.8"/><path d="M145 66H155M145 78H155M145 90H155M145 102H155" stroke="#566275" stroke-width="2"/></g><path d="M236 154L434 164" stroke="#566275" stroke-width="1.5"/><circle cx="434" cy="164" r="4" fill="#e9edf3"/><text x="40" y="150" font-size="16" fill="#e9edf3" font-weight="650" text-anchor="start" >Left button</text><text x="40" y="171" font-size="15" fill="#c3cede" font-weight="400" text-anchor="start" >Left click</text><circle cx="45" cy="186" r="4.5" fill="#ffb454"/><text x="56" y="191" font-size="15" fill="#74dd9b" font-weight="600" text-anchor="start" >Enter: send</text><path d="M236 266L357 292" stroke="#566275" stroke-width="1.5"/><circle cx="357" cy="292" r="4" fill="#e9edf3"/><text x="40" y="262" font-size="16" fill="#e9edf3" font-weight="650" text-anchor="start" >Thumb trigger</text><text x="40" y="283" font-size="15" fill="#ffb454" font-weight="400" text-anchor="start" >Hold for the second layer</text><path d="M236 362L383 348" stroke="#566275" stroke-width="1.5"/><circle cx="383" cy="348" r="4" fill="#e9edf3"/><text x="40" y="358" font-size="16" fill="#e9edf3" font-weight="650" text-anchor="start" >Side forward</text><text x="40" y="379" font-size="15" fill="#c3cede" font-weight="400" text-anchor="start" >F14</text><circle cx="45" cy="394" r="4.5" fill="#ffb454"/><text x="56" y="399" font-size="15" fill="#c3cede" font-weight="600" text-anchor="start" >F17</text><path d="M236 458L384 408" stroke="#566275" stroke-width="1.5"/><circle cx="384" cy="408" r="4" fill="#e9edf3"/><text x="40" y="454" font-size="16" fill="#e9edf3" font-weight="650" text-anchor="start" >Side back</text><text x="40" y="475" font-size="15" fill="#c3cede" font-weight="400" text-anchor="start" >F13</text><circle cx="45" cy="490" r="4.5" fill="#ffb454"/><text x="56" y="495" font-size="15" fill="#c3cede" font-weight="600" text-anchor="start" >F16</text><path d="M688 154L480 174" stroke="#566275" stroke-width="1.5"/><circle cx="480" cy="174" r="4" fill="#e9edf3"/><text x="700" y="150" font-size="16" fill="#e9edf3" font-weight="650" text-anchor="start" >Wheel</text><text x="700" y="171" font-size="15" fill="#c3cede" font-weight="400" text-anchor="start" >Click and scroll as usual</text><circle cx="705" cy="186" r="4.5" fill="#ffb454"/><text x="716" y="191" font-size="15" fill="#c3cede" font-weight="600" text-anchor="start" >Click F18, scroll volume</text><path d="M688 274L562 240" stroke="#566275" stroke-width="1.5"/><circle cx="562" cy="240" r="4" fill="#e9edf3"/><text x="700" y="270" font-size="16" fill="#e9edf3" font-weight="650" text-anchor="start" >Right button</text><text x="700" y="291" font-size="15" fill="#c3cede" font-weight="400" text-anchor="start" >Right click</text><circle cx="705" cy="306" r="4.5" fill="#ffb454"/><text x="716" y="311" font-size="15" fill="#62b5ff" font-weight="600" text-anchor="start" >F20: talk / stop</text><path d="M688 394L480 274" stroke="#566275" stroke-width="1.5"/><circle cx="480" cy="274" r="4" fill="#e9edf3"/><text x="700" y="390" font-size="16" fill="#e9edf3" font-weight="650" text-anchor="start" >Top button</text><text x="700" y="411" font-size="15" fill="#c3cede" font-weight="400" text-anchor="start" >F15</text><text x="480.0" y="604" font-size="13" fill="#9aa6b8" font-weight="400" text-anchor="middle" >Generic mouse seen from above, thumb side on the left. Not to scale.</text></svg>
